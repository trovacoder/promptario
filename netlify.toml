# Configuración de Netlify para Promptario.
# Netlify ejecuta el generador en cada cambio del repositorio y publica la carpeta dist/.
# Si el generador encuentra un error en los datos, la publicación se detiene y el sitio anterior sigue en línea.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Encabezados de seguridad para todas las páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hojas de estilo y scripts: llevan una huella (?v=...) que cambia con cada versión,
# así que pueden guardarse en caché durante un año sin riesgo de mostrar versiones viejas.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/fuentes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Dirección principal sin www
[[redirects]]
  from = "https://www.promptario.work/*"
  to = "https://promptario.work/:splat"
  status = 301
  force = true
